name: heartbeat
on:
  schedule:
    - cron: "23 4 * * 1"   # 每週一：公開 repo 60 天沒 commit 排程會被停用，兩期之間約 60 天
  workflow_dispatch:
permissions:
  contents: write
jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          date -u +%Y-%m-%dT%H:%MZ > heartbeat.txt
          git config user.name "winning-numbers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "heartbeat"
          git push
